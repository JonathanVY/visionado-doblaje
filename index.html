<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proceso de Visionado de Doblaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#FBF6EF;
    --panel:#FFFFFF;
    --panel-alt:#F4EBDD;
    --panel-line: #E7D9C2;
    --text:#1A1410;
    --muted:#5B5044;
    --dim:#8A7C68;

    --orange:#FF6A1A;
    --orange-light:#E8500A;
    --orange-deep:#B83B0C;
    --orange-soft: rgba(255,106,26,0.10);

    --s1:#E8590F;
    --s2:#C25A12;
    --s3:#C43D0D;
    --s4:#A8720A;

    --accent-card: var(--orange);

    --shadow-card: 0 1px 2px rgba(26,20,16,0.04), 0 10px 26px -14px rgba(26,20,16,0.18);

    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--void);
    color:var(--text);
    font-family:'Space Grotesk', -apple-system, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  .mono{ font-family:'IBM Plex Mono', monospace; }
  .val-sans{ font-family:'Space Grotesk', sans-serif; color:var(--muted); display:block; }

  #bg-wave{ position:fixed; inset:0; z-index:0; opacity:0.55; pointer-events:none; }
  #app{ position:relative; z-index:1; min-height:100%; }

  .screen{ display:none; min-height:100vh; min-height:100dvh; }
  .screen.active{ display:block; }

  /* ---------- clapper stripe motif ---------- */
  .clapper-stripe{
    height:9px; border-radius:3px;
    background:repeating-linear-gradient(45deg, var(--orange) 0 9px, #070502 9px 18px);
  }

  /* ---------- HERO ---------- */
  #screen-hero{
    display:none;
    min-height:100vh; min-height:100dvh;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:8vh 6vw;
    position:relative;
  }
  #screen-hero.active{ display:flex; }
  #screen-hero::before{
    content:''; position:absolute; inset:0; z-index:-1;
    background:radial-gradient(ellipse 60% 45% at 50% 38%, rgba(255,106,26,0.10), transparent 70%);
  }

  .hero-clapper{ width:30px; height:30px; color:var(--orange); margin-bottom:1.4rem; }
  .hero-clapper svg{ width:100%; height:100%; }

  .hero-eyebrow{ font-size:0.78rem; letter-spacing:0.14em; color:var(--dim); margin-bottom:1.4rem; }
  .hero-eyebrow b{ color:var(--muted); font-weight:600; }

  .clapper-stripe.hero{ width:100px; margin:0 auto 1.8rem; }

  h1.hero-title{
    font-size:clamp(2.6rem, 8vw, 5.6rem);
    line-height:1.02;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
    max-width:16ch;
  }
  h1.hero-title .line2{
    display:block;
    background:linear-gradient(100deg,var(--orange-light),var(--orange));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .btn-primary{
    appearance:none; border:none; cursor:pointer;
    background:var(--orange); color:#100b08;
    font-family:inherit; font-weight:700; font-size:1rem;
    padding:1rem 2.1rem; border-radius:100px;
    display:inline-flex; align-items:center; gap:0.6rem;
    margin-top:3rem;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow:0 0 0 0 rgba(255,106,26,0);
  }
  .btn-primary:hover{ background:var(--orange-light); transform:translateY(-2px); box-shadow:0 14px 34px -10px rgba(255,106,26,0.55); }
  .btn-primary:active{ transform:translateY(0); }
  .btn-primary svg{ width:16px; height:16px; transition:transform 0.15s ease; }
  .btn-primary:hover svg{ transform:translateX(3px); }

  .hero-preview{
    margin-top:4rem;
    display:flex; flex-wrap:wrap; justify-content:center; gap:0.5rem 0;
    font-size:0.78rem; color:var(--dim);
  }
  .hero-preview button{
    all:unset; cursor:pointer;
    padding:0.4rem 0.9rem; border-right:1px solid var(--panel-line);
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--dim);
    display:inline-flex; align-items:center; gap:0.5rem;
    transition:color 0.15s ease;
  }
  .hero-preview button:last-child{ border-right:none; }
  .hero-preview button b{ color:var(--muted); font-weight:500; transition:color 0.15s ease; }
  .hero-preview button .chip{ width:6px; height:6px; border-radius:50%; background:var(--dim); flex:none; transition:background 0.15s ease, box-shadow 0.15s ease; }
  .hero-preview button:hover{ color:var(--hp-accent); }
  .hero-preview button:hover b{ color:var(--hp-accent); }
  .hero-preview button:hover .chip{ background:var(--hp-accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--hp-accent) 22%, transparent); }
  .hero-preview button:focus-visible{ outline:2px solid var(--hp-accent); outline-offset:3px; border-radius:6px; }

  /* ---------- TOPBAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.4rem clamp(1.2rem,4vw,3rem);
    border-bottom:1px solid var(--panel-line);
    position:sticky; top:0; z-index:20;
    background:rgba(251,246,239,0.86);
    backdrop-filter:blur(10px);
  }
  .topbar-title{
    font-size:0.95rem; font-weight:600; letter-spacing:0.01em;
    display:flex; align-items:center; gap:0.6rem;
    cursor:pointer; background:none; border:none; color:var(--text); font-family:inherit;
  }
  .topbar-title .ticon{ width:16px; height:16px; flex:none; display:flex; }
  .topbar-title .ticon svg{ width:100%; height:100%; }
  .topbar-link{
    font-size:0.85rem; color:var(--muted); text-decoration:none;
    display:flex; align-items:center; gap:0.4rem;
    background:none; border:none; cursor:pointer; font-family:inherit;
    padding:0.5rem 0.9rem; border-radius:100px; transition:background 0.15s ease, color 0.15s ease;
  }
  .topbar-link:hover{ background:var(--panel); color:var(--text); }
  .topbar-link svg{ width:14px; height:14px; }

  /* ---------- OVERVIEW ---------- */
  #screen-overview .wrap{
    max-width:1180px; margin:0 auto;
    padding:clamp(2.2rem,6vw,4.5rem) clamp(1.2rem,4vw,3rem) 6rem;
  }
  .overview-heading{ max-width:60ch; margin:0 auto 3.2rem; text-align:center; }
  .overview-heading .clapper-stripe{ width:60px; margin:0 auto 1.1rem; }
  .overview-heading h2{ font-size:clamp(1.7rem,3.8vw,2.4rem); margin:0 0 0.8rem; font-weight:700; letter-spacing:-0.01em; }
  .overview-heading p{ color:var(--muted); line-height:1.6; margin:0 auto; font-size:1rem; max-width:52ch; }

  .pipeline{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; position:relative; }
  .pipeline-connector{
    grid-column:1/-1; display:flex; justify-content:space-between;
    padding:0 clamp(1.1rem,2.6vw,2.3rem); margin:-1.55rem 0 1.4rem; pointer-events:none;
  }
  .pipeline-connector svg{ width:34px; height:14px; color:var(--dim); }
  @media (max-width:880px){
    .pipeline{ grid-template-columns:1fr; gap:1.1rem; }
    .pipeline-connector{ display:none; }
  }

  .stage-card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:18px;
    padding:1.9rem 1.5rem 1.7rem; text-align:left; cursor:pointer; font-family:inherit; color:var(--text);
    display:flex; flex-direction:column; gap:0.85rem; position:relative;
    box-shadow:var(--shadow-card);
    transition:border-color 0.15s ease, transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .stage-card::before{
    content:''; position:absolute; top:0; left:1.4rem; right:1.4rem; height:3px; border-radius:0 0 3px 3px;
    background:var(--accent-card);
  }
  @media (min-width:881px){
    .stage-card:nth-child(1){ border-top-right-radius:0; border-bottom-right-radius:0; border-right:none; }
    .stage-card:nth-child(2){ border-radius:0; border-right:none; }
    .stage-card:nth-child(3){ border-radius:0; border-right:none; }
    .stage-card:nth-child(4){ border-top-left-radius:0; border-bottom-left-radius:0; }
  }
  .stage-card:hover{ background:var(--panel-alt); transform:translateY(-3px); box-shadow:0 1px 2px rgba(26,20,16,0.05), 0 18px 34px -16px rgba(26,20,16,0.28); }
  .stage-card:focus-visible{ outline:2px solid var(--accent-card); outline-offset:2px; }

  .stage-icon{
    width:36px; height:36px; border-radius:10px; background:var(--panel-alt);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .stage-icon svg{ width:18px; height:18px; }

  .stage-num{ font-size:0.72rem; letter-spacing:0.08em; color:var(--dim); }
  .stage-card h3{ margin:0; font-size:1.15rem; font-weight:600; line-height:1.25; }
  .stage-field{ font-size:0.8rem; color:var(--muted); line-height:1.5; }
  .stage-field b{ color:var(--dim); font-weight:500; }
  .stage-goto{ margin-top:auto; padding-top:0.4rem; font-size:0.8rem; color:var(--dim); display:flex; align-items:center; gap:0.35rem; }
  .stage-card:hover .stage-goto{ color:var(--text); }
  .stage-goto svg{ width:13px; height:13px; transition:transform 0.15s ease; }
  .stage-card:hover .stage-goto svg{ transform:translateX(3px); }

  /* ---------- DETAIL ---------- */
  #screen-detail .wrap{ max-width:1100px; margin:0 auto; padding:clamp(1.8rem,5vw,3.2rem) clamp(1.2rem,4vw,3rem) 7rem; }
  .detail-head{ margin-bottom:2.6rem; }
  .detail-crumbs{ display:flex; align-items:center; gap:0.5rem; margin-bottom:1.4rem; }
  .crumb-dot{
    width:8px; height:8px; border-radius:50%; background:var(--panel);
    border:1.5px solid var(--panel-line); cursor:pointer; padding:0;
    transition:background 0.15s ease, border-color .15s ease, transform .15s ease;
  }
  .crumb-dot.active{ background:var(--accent-card); border-color:var(--accent-card); transform:scale(1.25); }

  .clapper-stripe.detail{ width:56px; margin-bottom:1.1rem; }
  .detail-title-row{ display:flex; align-items:center; gap:1rem; }
  .detail-icon{ width:48px; height:48px; border-radius:12px; background:var(--panel-alt); display:flex; align-items:center; justify-content:center; flex:none; }
  .detail-icon svg{ width:24px; height:24px; }
  .detail-eyebrow{ font-size:0.78rem; color:var(--dim); margin-bottom:0.4rem; letter-spacing:0.03em; }
  .detail-eyebrow b{ color:var(--accent-card); font-weight:600; }
  .detail-head h2{ font-size:clamp(1.7rem,4vw,2.5rem); margin:0; font-weight:700; letter-spacing:-0.01em; }
  .detail-tagline{ margin:0.9rem 0 0; color:var(--muted); font-style:italic; font-size:0.98rem; max-width:55ch; }

  .io-strip{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--panel-line);
    border:1px solid var(--panel-line); border-radius:14px; overflow:hidden; margin-top:1.8rem;
  }
  .io-cell{ background:var(--panel); padding:1rem 1.2rem; }
  .io-cell .lbl{ font-size:0.68rem; color:var(--dim); letter-spacing:0.08em; margin-bottom:0.4rem; display:block; }
  .io-cell .val{ font-size:0.88rem; line-height:1.4; }
  @media (max-width:640px){ .io-strip{ grid-template-columns:1fr; } }

  .flow-section{ margin-top:3.4rem; }
  .flow-section > h4{ font-size:0.78rem; letter-spacing:0.08em; color:var(--dim); margin:0 0 1.4rem; display:flex; align-items:center; gap:0.6rem; }
  .flow-section > h4::after{ content:''; flex:1; height:1px; background:var(--panel-line); }

  .flow-chain-h{ display:flex; align-items:flex-start; gap:0.9rem; flex-wrap:wrap; }
  @media (max-width:640px){
    .flow-chain-h{ flex-wrap:nowrap; overflow-x:auto; padding-bottom:0.7rem; margin:0 -1.2rem; padding-left:1.2rem; padding-right:1.2rem; }
  }

  .step-card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px;
    padding:1.4rem 1.4rem 1.25rem; width:280px; flex:0 0 auto;
    display:flex; flex-direction:column; gap:0.85rem; position:relative;
    box-shadow:var(--shadow-card);
  }
  @media (max-width:640px){ .step-card{ width:78vw; max-width:320px; } }
  .step-card-top{ display:flex; align-items:center; justify-content:space-between; gap:0.6rem; }
  .step-index{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--accent-card); color:var(--accent-card);
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:600; flex:none;
  }
  .step-card h5{ margin:0; font-size:1.02rem; font-weight:600; line-height:1.3; }
  .flow-grid{ display:grid; grid-template-columns:1fr; gap:0.55rem; }
  .flow-grid div{ font-size:0.8rem; }
  .flow-grid b{ display:block; font-size:0.62rem; letter-spacing:0.08em; color:var(--dim); margin-bottom:0.15rem; font-weight:500; font-family:'IBM Plex Mono',monospace; }

  .btn-chip-secondary{
    all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:0.35rem;
    font-family:'IBM Plex Mono',monospace; font-size:0.62rem; letter-spacing:.04em; color:var(--dim);
    border:1px solid var(--panel-line); padding:0.3rem 0.55rem; border-radius:100px;
    transition:color .15s ease, border-color .15s ease;
  }
  .btn-chip-secondary svg{ width:11px; height:11px; }
  .btn-chip-secondary:hover, .btn-chip-secondary.active{ color:var(--orange); border-color:var(--orange); }

  .branch-panel{ display:none; }
  .branch-panel.open{ display:block; animation:fadeIn 0.3s ease both; }
  .branch-panel-inner{ background:var(--panel-alt); border:1px dashed var(--panel-line); border-radius:12px; padding:1rem 1.1rem; margin-top:0.2rem; }
  .branch-panel-inner h6{ margin:0 0 0.6rem; font-size:0.88rem; font-weight:600; color:var(--orange-deep); }
  .branch-tag{ font-size:0.62rem; letter-spacing:.06em; color:var(--dim); display:flex; align-items:center; gap:0.4rem; margin-bottom:0.6rem; }
  .branch-tag svg{ width:12px; height:12px; }

  .btn-next-step{
    all:unset; cursor:pointer; margin-top:0.2rem; padding-top:0.9rem; border-top:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:.03em; color:var(--orange-deep);
  }
  .btn-next-step svg{ width:14px; height:14px; transition:transform .15s ease; }
  .btn-next-step:hover svg{ transform:translateX(3px); }

  .step-connector{ display:flex; align-items:center; color:var(--dim); flex:none; padding-top:1.7rem; }
  .step-connector svg{ width:20px; height:20px; }

  .step-complete{ margin-top:1.4rem; display:flex; align-items:center; gap:0.55rem; font-size:0.8rem; color:var(--orange-deep); }
  .step-complete svg{ width:17px; height:17px; }

  /* bottleneck */
  .bottleneck{ margin-top:3.4rem; background:var(--panel-alt); border:1px solid var(--panel-line); border-radius:16px; padding:1.5rem 1.6rem 1.7rem; box-shadow:var(--shadow-card); }
  .bottleneck-toggle{ all:unset; cursor:pointer; display:flex; align-items:center; gap:0.75rem; width:100%; }
  .bottleneck-toggle .bn-icon{ color:var(--orange); flex:none; display:flex; width:18px; height:18px; }
  .bottleneck-toggle .bn-icon svg{ width:100%; height:100%; }
  .bottleneck-toggle .bn-toggle-label{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; letter-spacing:.07em; color:var(--text); font-weight:600; }
  .bottleneck-toggle .chev{ margin-left:auto; color:var(--dim); transition:transform .2s ease; flex:none; width:16px; height:16px; }
  .bottleneck-toggle .chev svg{ width:100%; height:100%; }

  #bottleneck-panel{ display:none; }
  #bottleneck-panel.open{ display:block; margin-top:1.3rem; }

  .bottleneck-chain{ display:flex; flex-wrap:wrap; align-items:stretch; gap:0.7rem; }
  .bn-card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:0.85rem 1rem; font-size:0.85rem; color:var(--muted); line-height:1.45; flex:1; min-width:180px; }
  .bn-arrow{ display:flex; align-items:center; color:var(--dim); flex:none; }
  .bn-arrow svg{ width:16px; height:16px; }
  @media (max-width:640px){ .bn-arrow svg{ transform:rotate(90deg); } .bottleneck-chain{ flex-direction:column; } }
  .bn-branches{ display:flex; gap:0.8rem; flex-wrap:wrap; }
  .bn-branches .bn-card{ flex:1; min-width:200px; }
  .bn-pop{ animation:bnPop 0.4s ease both; }
  @keyframes bnPop{ from{ opacity:0; transform:translateY(8px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }

  /* footer nav */
  .detail-nav{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:3.6rem; padding-top:2rem; border-top:1px solid var(--panel-line); }
  .nav-btn{
    background:var(--panel); border:1px solid var(--panel-line); color:var(--text); font-family:inherit;
    cursor:pointer; border-radius:12px; padding:0.85rem 1.1rem; display:flex; align-items:center; gap:0.7rem;
    max-width:46%; text-align:left; transition:background 0.15s ease, border-color 0.15s ease;
  }
  .nav-btn:hover{ background:var(--panel-alt); border-color:var(--orange); }
  .nav-btn:disabled{ opacity:0.3; pointer-events:none; }
  .nav-btn.next{ margin-left:auto; text-align:right; flex-direction:row-reverse; }
  .nav-btn svg{ width:16px; height:16px; flex:none; color:var(--dim); }
  .nav-btn .nb-lbl{ font-size:0.68rem; color:var(--dim); letter-spacing:0.06em; display:block; margin-bottom:0.15rem; }
  .nav-btn .nb-name{ font-size:0.9rem; font-weight:600; }

  ::selection{ background:var(--orange); color:#0B0908; }

  .fade-in{ animation:fadeIn 0.35s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  #version-badge{
    position:fixed; right:calc(14px + env(safe-area-inset-right, 0px)); bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    font-size:0.66rem; color:rgba(251,246,239,0.85); opacity:0.85; letter-spacing:0.02em; z-index:50; pointer-events:none;
    background:rgba(26,20,16,0.82); padding:0.25rem 0.55rem; border-radius:100px; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(4px);
  }
  @media (max-width:560px){ #version-badge{ font-size:0.6rem; } }
</style>
</head>
<body>

<svg id="bg-wave" preserveAspectRatio="none"></svg>

<div id="app">

  <div id="version-badge" class="mono"></div>

  <!-- HERO -->
  <section id="screen-hero" class="screen active">
    <div class="hero-clapper" id="hero-clapper-icon"></div>
    <div class="hero-eyebrow mono">PROCESO INTERNO · DISTRIBUCIÓN <b>· 4 ETAPAS</b></div>
    <div class="clapper-stripe hero"></div>
    <h1 class="hero-title">Proceso de visionado<span class="line2">de doblaje</span></h1>
    <button class="btn-primary" id="btn-enter">
      Ver las 4 etapas
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="hero-preview mono" id="hero-preview"></div>
  </section>

  <!-- OVERVIEW -->
  <section id="screen-overview" class="screen">
    <div class="topbar">
      <button class="topbar-title" id="brand-home">
        <span class="ticon" id="brand-ticon-1"></span> Visionado de doblaje
      </button>
      <span class="topbar-link" style="cursor:default;">Vista general</span>
    </div>
    <div class="wrap">
      <div class="overview-heading fade-in">
        <div class="clapper-stripe"></div>
        <h2>Etapas Visionado De Doblaje</h2>
        <p>Cada etapa recibe lo que entrega la anterior. Elige una para ver su desglose completo, responsables y cuellos de botella.</p>
      </div>
      <div class="pipeline" id="pipeline"></div>
    </div>
  </section>

  <!-- DETAIL -->
  <section id="screen-detail" class="screen">
    <div class="topbar">
      <button class="topbar-title" id="brand-home-2">
        <span class="ticon" id="brand-ticon-2"></span> Visionado de doblaje
      </button>
      <button class="topbar-link" id="btn-overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        Vista general
      </button>
    </div>
    <div class="wrap" id="detail-wrap"></div>
  </section>

</div>

<script>
/* ---------------- VERSIÓN DEL SITIO ---------------- */
const SITE_VERSION = 'v3.0';
const SITE_UPDATED  = '30 sep 2026';

/* ---------------- ESTADO ---------------- */
let currentStage = 0;
let stepReveal = 1;

/* ---------------- ROUTING ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHero(){ showScreen('screen-hero'); }
function goOverview(){ showScreen('screen-overview'); }
function goDetail(idx){
  currentStage = idx;
  stepReveal = 1;
  renderDetail(idx);
  showScreen('screen-detail');
}

/* ---------------- BRAND ICONS ---------------- */

document.getElementById('brand-ticon-1').innerHTML = iconClapper;

/* ---------------- HERO PREVIEW LIST ---------------- */

).join('');

});

/* ---------------- DETAIL: PASOS HORIZONTALES PROGRESIVOS ---------------- */
function stepCardHTML(step, i, s, isLast, hasMore){
  return `
    <div class="step-card fade-in" style="--accent-card:var(${s.accent})">
      <div class="step-card-top">
        <span class="step-index mono">0${i+1}</span>
        ${step.branch ? `<button class="btn-chip-secondary" data-branch="${i}">${iconBranch} Proceso secundario</button>` : ''}
      </div>
      <h5>${step.title}</h5>
      <div class="flow-grid mono">
        <div><b>Entrada</b><span class="val-sans">${step.entrada}</span></div>
        <div><b>Responsable</b><span class="val-sans">${step.responsable}</span></div>
        <div><b>Resultado</b><span class="val-sans">${step.resultado}</span></div>
      </div>
      ${step.branch ? `
      <div class="branch-panel" id="branch-panel-${i}">
        <div class="branch-panel-inner">
          <div class="branch-tag mono">${iconBranch} PROCESO SECUNDARIO</div>
          <h6>${step.branch.title}</h6>
          <div class="flow-grid mono">
            <div><b>Entrada</b><span class="val-sans">${step.branch.entrada}</span></div>
            <div><b>Responsable</b><span class="val-sans">${step.branch.responsable}</span></div>
            <div><b>Resultado</b><span class="val-sans">${step.branch.resultado}</span></div>
          </div>
        </div>
      </div>` : ''}
      ${isLast && hasMore ? `<button class="btn-next-step mono" data-next="1">Ver siguiente paso ${iconArrow}</button>` : ''}
    </div>`;
}

function buildStepsHTML(s){
  let html = '';
  for(let i=0; i<stepReveal; i++){
    const isLast = (i === stepReveal-1);
    const hasMore = stepReveal < s.steps.length;
    html += stepCardHTML(s.steps[i], i, s, isLast, hasMore);
    if(i < stepReveal-1) html += `<div class="step-connector">${iconArrow}</div>`;
  }
  return html;
}

function refreshSteps(s){
  const container = document.getElementById('flow-chain-h');
  container.innerHTML = buildStepsHTML(s);

  container.querySelectorAll('.btn-next-step').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      stepReveal = Math.min(stepReveal+1, s.steps.length);
      refreshSteps(s);
      const done = document.getElementById('step-complete-msg');
      if(done) done.remove();
      if(stepReveal >= s.steps.length){
        const flowSection = document.querySelector('.flow-section');
        const msg = document.createElement('div');
        msg.className = 'step-complete';
        msg.id = 'step-complete-msg';
        msg.innerHTML = iconCheck + ' Etapa completa — toda la información está arriba';
        flowSection.appendChild(msg);
      }
    });
  });
  container.querySelectorAll('.btn-chip-secondary').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = document.getElementById('branch-panel-'+btn.dataset.branch);
      const open = panel.classList.toggle('open');
      btn.classList.toggle('active', open);
    });
  });
}

/* ---------------- DETAIL: CUELLO DE BOTELLA ---------------- */
function buildBottleneckItemsHTML(s){
  if(s.bottleneck.type === 'chain'){
    return `<div class="bottleneck-chain">` + s.bottleneck.items.map((it,i)=>
      (i>0 ? `<div class="bn-arrow">${iconArrow}</div>` : '') +
      `<div class="bn-card bn-pop" style="animation-delay:${(i*0.09).toFixed(2)}s">${it}</div>`
    ).join('') + `</div>`;
  }
  return `
    <div class="bn-card bn-pop" style="margin-bottom:0.9rem; max-width:340px;">
      <b class="mono" style="font-size:0.62rem;letter-spacing:.06em;opacity:.7;display:block;margin-bottom:.3rem;">ORIGEN</b>${s.bottleneck.origin}
    </div>
    <div class="bn-branches">${s.bottleneck.items.map((it,i)=>
      `<div class="bn-card bn-pop" style="animation-delay:${((i+1)*0.09).toFixed(2)}s">${it}</div>`).join('')}</div>`;
}

function wireBottleneck(s){
  const btn = document.getElementById('bottleneck-toggle');
  const panel = document.getElementById('bottleneck-panel');
  btn.addEventListener('click', ()=>{
    const isOpen = panel.classList.contains('open');
    if(isOpen){
      panel.classList.remove('open');
      btn.querySelector('.bn-toggle-label').textContent = 'Mostrar cuello de botella';
      btn.querySelector('.chev').style.transform = 'rotate(0deg)';
    } else {
      panel.innerHTML = buildBottleneckItemsHTML(s);
      panel.classList.add('open');
      btn.querySelector('.bn-toggle-label').textContent = 'Ocultar cuello de botella';
      btn.querySelector('.chev').style.transform = 'rotate(180deg)';
    }
  });
}

/* ---------------- RENDER DETAIL ---------------- */
function renderDetail(idx){
  const s = STAGES[idx];
  const prev = idx>0 ? STAGES[idx-1] : null;
  const next = idx<STAGES.length-1 ? STAGES[idx+1] : null;

  document.getElementById('detail-wrap').innerHTML = `
    <div class="detail-head fade-in">
      <div class="detail-crumbs">
        ${STAGES.map((st,i)=>`<button class="crumb-dot ${i===idx?'active':''}" style="${i===idx?`background:var(${st.accent});border-color:var(${st.accent})`:''}" data-idx="${i}" aria-label="${st.name}"></button>`).join('')}
      </div>
      <div class="clapper-stripe detail"></div>
      <div class="detail-title-row">
        <div class="detail-icon" style="color:var(${s.accent})">${ICONS[s.icon]}</div>
        <div>
          <div class="detail-eyebrow mono">ETAPA 0${s.num} DE 0${STAGES.length} · <b style="color:var(${s.accent})">${s.name.toUpperCase()}</b></div>
          <h2>${s.name}</h2>
        </div>
      </div>
      <p class="detail-tagline">${s.tagline}</p>
      <div class="io-strip">
        <div class="io-cell"><span class="lbl mono">ENTRADA</span><span class="val">${s.summary.entrada}</span></div>
        <div class="io-cell"><span class="lbl mono">RESPONSABLE</span><span class="val">${s.summary.responsable}</span></div>
        <div class="io-cell"><span class="lbl mono">RESULTADO</span><span class="val">${s.summary.resultado}</span></div>
      </div>
    </div>

    <div class="flow-section">
      <h4>Desglose del proceso</h4>
      <div class="flow-chain-h" id="flow-chain-h"></div>
    </div>

    <div class="bottleneck">
      <button class="bottleneck-toggle" id="bottleneck-toggle">
        <span class="bn-icon">${iconHourglass}</span>
        <span class="bn-toggle-label mono">${s.bottleneck.label ? 'MOSTRAR: ' + s.bottleneck.label : 'MOSTRAR CUELLO DE BOTELLA'}</span>
        <span class="chev">${iconChevron}</span>
      </button>
      <div id="bottleneck-panel"></div>
    </div>

    <div class="detail-nav">
      <button class="nav-btn prev" ${prev ? '' : 'disabled'} id="nav-prev">
        ${iconArrowLeft}
        <span>${prev ? `<span class="nb-lbl mono">ANTERIOR</span><span class="nb-name">${prev.name}</span>` : ''}</span>
      </button>
      <button class="nav-btn next" ${next ? '' : 'disabled'} id="nav-next">
        <span>${next ? `<span class="nb-lbl mono">SIGUIENTE</span><span class="nb-name">${next.name}</span>` : ''}</span>
        ${iconArrow}
      </button>
    </div>
  `;

  refreshSteps(s);
  wireBottleneck(s);

  document.querySelectorAll('.crumb-dot').forEach(d=>{
    d.addEventListener('click', ()=> goDetail(parseInt(d.dataset.idx)));
  });
  const navPrev = document.getElementById('nav-prev');
  const navNext = document.getElementById('nav-next');
  if(navPrev) navPrev.addEventListener('click', ()=> prev && goDetail(idx-1));
  if(navNext) navNext.addEventListener('click', ()=> next && goDetail(idx+1));
}

/* ---------------- NAV WIRES ---------------- */
document.getElementById('btn-enter').addEventListener('click', goOverview);
document.getElementById('brand-home').addEventListener('click', goHero);
document.getElementById('brand-home-2').addEventListener('click', goHero);
document.getElementById('btn-overview').addEventListener('click', goOverview);

document.addEventListener('keydown', (e)=>{
  const detailActive = document.getElementById('screen-detail').classList.contains('active');
  if(!detailActive) return;
  if(e.key === 'ArrowRight' && currentStage < STAGES.length-1) goDetail(currentStage+1);
  if(e.key === 'ArrowLeft' && currentStage > 0) goDetail(currentStage-1);
  if(e.key === 'Escape') goOverview();
});

/* ---------------- FONDO: ONDA DE AUDIO (tonos naranja) ---------------- */
(function(){
  const svg = document.getElementById('bg-wave');
  const W = 1000, H = 300;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let bars = '';
  const n = 90;
  for(let i=0;i<n;i++){
    const x = (i/n)*W;
    const h = 6 + Math.abs(Math.sin(i*0.4)) * 40 + Math.random()*18;
    const y = H - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(W/n*0.45).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="url(#gwave)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="${(i*0.012).toFixed(2)}s" dur="0.6s" fill="freeze"/></rect>`;
  }
  svg.innerHTML = `
    <defs>
      <linearGradient id="gwave" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#FF6A1A" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#FF6A1A" stop-opacity="0.05"/>
      </linearGradient>
    </defs>
    <g>${bars}</g>`;
  svg.style.position='fixed'; svg.style.left=0; svg.style.right=0; svg.style.bottom=0;
  svg.style.width='100%'; svg.style.height='30vh';
})();
</script>
